<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>prime-video midroll fixture</title></head>
<body data-platform="prime-video" data-kind="midroll" data-stitched="false">
<div class="player-root">
  <video class="content-video" src="blob:content"></video>
  <div class="player-controls">
    <button class="play-pause" aria-label="Play">Play</button>
    <div class="progress-bar" role="slider" aria-valuenow="0"></div>
    <button class="volume-button" aria-label="Volume">Vol</button>
  </div>
  <div class="subtitles" aria-live="polite">Subtitle line</div>
  <div class="ad-banner" data-corpus-ad><img src="https://aax-us-east.amazon-adsystem.com/x.png" alt=""></div>
</div>
</body></html>
