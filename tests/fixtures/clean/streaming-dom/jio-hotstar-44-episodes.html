<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>jio-hotstar clean episodes</title></head>
<body data-platform="jio-hotstar" data-clean="true">
<div class="player-root" data-state="episodes">
  <video class="content-video" src="blob:content"></video>
  <div class="player-controls">
    <button class="play-pause" aria-label="Play">Play</button>
    <div class="progress-bar" role="slider" aria-valuenow="42"></div>

    <button class="skip-intro">Skip intro</button>
    <span class="ad-free-badge">Ad-free</span>
  </div>
  <div class="subtitles" aria-live="polite">Where were you last night?</div>
  <ul class="episode-list"><li><a href="/e1">Episode 1</a></li><li><a href="/e2">Episode 2</a></li></ul>
