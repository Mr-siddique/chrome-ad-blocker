<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>jio-hotstar clean audio-menu</title></head>
<body data-platform="jio-hotstar" data-clean="true">
<div class="player-root" data-state="audio-menu">
  <video class="content-video" src="blob:content"></video>
  <div class="player-controls">
    <button class="play-pause" aria-label="Play">Play</button>
    <div class="progress-bar" role="slider" aria-valuenow="42"></div>
    <button class="volume-button" aria-label="Volume">Vol</button>
    <button class="subtitle-toggle" aria-label="Subtitles">CC</button>
    <button class="skip-intro">Skip intro</button>
    <span class="ad-free-badge">Ad-free</span>
  </div>
  <div class="subtitles" aria-live="polite">Where were you last night?</div>
  <div class="audio-menu"><button>English</button><button>Hindi</button></div>
</div>
</body></html>
